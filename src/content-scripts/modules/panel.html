<div id="cge">
  <div class="container">
    <div id="cge-panel" class="panel">
      <div class="panel-title">ChessGod</div>

      <label class="field">
        <span>Show</span>
        <select data-field="displayMode">
          <option value="arrows">Arrows only</option>
          <option value="squares">Squares only</option>
          <option value="both">Arrows + squares</option>
        </select>
      </label>

      <div class="side">
        <label class="switch">
          <input type="checkbox" data-field="mine.enabled" />
          <span>My best move</span>
        </label>
        <div class="side-controls">
          <label class="field">
            <span>Color</span>
            <input type="color" data-field="mine.color" />
          </label>
          <label class="field">
            <span>Opacity</span>
            <input type="range" min="0.1" max="1" step="0.05" data-field="mine.opacity" />
          </label>
        </div>
        <label class="field">
          <span>Depth (<span id="cge-mine-depth-value"></span>)</span>
          <input type="range" min="1" max="24" step="1" data-field="mine.depth" />
        </label>
        <label class="field">
          <span>Max think time (<span id="cge-mine-movetimeMs-value"></span>ms)</span>
          <input type="range" min="100" max="15000" step="100" data-field="mine.movetimeMs" />
        </label>
      </div>

      <div class="side">
        <label class="switch">
          <input type="checkbox" data-field="enemy.enabled" />
          <span>Enemy best move</span>
        </label>
        <div class="side-controls">
          <label class="field">
            <span>Color</span>
            <input type="color" data-field="enemy.color" />
          </label>
          <label class="field">
            <span>Opacity</span>
            <input type="range" min="0.1" max="1" step="0.05" data-field="enemy.opacity" />
          </label>
        </div>
        <label class="field">
          <span>Depth (<span id="cge-enemy-depth-value"></span>)</span>
          <input type="range" min="1" max="24" step="1" data-field="enemy.depth" />
        </label>
        <label class="field">
          <span>Max think time (<span id="cge-enemy-movetimeMs-value"></span>ms)</span>
          <input type="range" min="100" max="15000" step="100" data-field="enemy.movetimeMs" />
        </label>
      </div>

      <div class="actions">
        <button type="button" class="btn" data-action="restart-game">
          Restart game
        </button>
        <button type="button" class="btn btn-danger" data-action="restart-engine">
          Restart engine
        </button>
      </div>
    </div>

    <div class="fab-wrap">
      <button id="cge--fab" class="fab" type="button">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          data-glyph="utility-cogwheel"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fill="currentColor"

      <div id="cge-loader" class="cge-loader"></div>
    </div>
  </div>
</div>
